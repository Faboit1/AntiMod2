# =====================================================================
#                  AntiMod - mod catalog (/antimod mods)
# =====================================================================
# Mods a /antimod mods scan can recognise. One line per mod:
#   <mod id>: {name: "Display name", keys: ["translation.key"]}
# The mod id is also the namespace of the plugin channels the mod
# registers, which is how channels are traced back to mods. A mod that uses
# another namespace can list patterns: channels: ["other:*"].
# Set enabled: false on an entry to leave it out of scans.
#
# Generated from the 4535 most downloaded mods on Modrinth (client-side)
# and CurseForge that ship a usable key. Each key is in every jar of its mod
# that was read, is not a vanilla key, and no other listed mod ships it.
# Ordered by downloads.
# =====================================================================
