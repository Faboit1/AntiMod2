# =====================================================================
#                 AntiMod - spoof-check mod list
# =====================================================================
# Used by `spoof-detection` in config.yml. Each entry is a mod that both
# registers plugin channels and ships its own translation keys.
#
# How an entry is used:
#   - If the client registered a channel matching `channels`, the mod is
#     installed, so the sweep also probes its `keys`.
#   - If none of those keys resolve, the client is hiding translations.
#
# Fields:
#   display-name   Name shown in alerts (optional, defaults to the entry id).
#   enabled        Set false to stop using this entry (default true).
#   channels       Channel patterns; `*` matches anything, e.g. "voicechat:*".
#   keys           Translation keys from the mod's lang file. Any ONE of them
#                  resolving clears the mod, so list a few stable ones.
#   trusted        Max priority (default false). The entry's result decides on
#                  its own: keys hidden = flagged straight away, whatever the
#                  other mods answered; keys verified = not flagged. Trusted
#                  entries are always probed and are never auto-disabled, so
#                  only trust a mod after checking that EVERY build that
#                  registers the channel ships the keys. One bad trusted entry
#                  kicks every player who uses that mod.
#
# Picking keys for a new mod: open the mod jar, read
# assets/<modid>/lang/en_us.json and choose short keys that clearly belong
# to the mod (keybind names like "key.<modid>.something" are ideal). Avoid
# values containing %s / %d, and keys that other mods also ship.
# `/antimod channels <player>` lists the channels a client registered.
#
# The entries below were generated from the 1000 most downloaded mods on
# Modrinth. Every listed key is present in EVERY sampled build of its mod:
# Fabric, Quilt, Forge and NeoForge, MC 1.16.5 and up, the newest and oldest
# build for each MC release. It is not a vanilla key, no other mod ships it,
# and its value is non-empty and safe in every language. Mods without such a
# key were left out. Channels assume the mod id is the channel namespace,
# which is the norm. Entries for mods that never register a channel simply
# never match, and cost nothing.
#
# AntiMod comments an entry out by itself if it fails for several different
# players who verified every other mod (see auto-disable-after in config.yml).
# Ordered by Modrinth download rank; with max-mods-per-sweep the first matches
# are probed, so keep reliable mods near the top.
# =====================================================================
mods:
  # ---- Trusted (max priority) ---------------------------------------
  # Mods OpSec was seen hiding even though the client announced their
  # channel, while it let most other mods' keys through (so the majority
  # rule alone would clear an OpSec user).

  plasmo-voice:
    display-name: "Plasmo Voice"
    trusted: true
    channels:
      - "plasmo:*"            # 1.x registers plasmo:voice, 2.x plasmo:voice/v2/...
      - "plasmovoice:*"
    keys:
      - "key.plasmovoice.general"     # 2.x (all 74 sampled builds)
      - "key.plasmovoice.settings"    # 2.x
      - "key.plasmo_voice.ptt"        # 1.x (all 25 builds, MC 1.16.4-1.19.3)
      - "key.plasmo_voice.mute"       # 1.x

  custom-player-models:
    display-name: "Customizable Player Models"
    trusted: true
    channels:
      - "cpm_net:*"
    keys:                     # in all 134 sampled builds that use networking
      - "key.cpm.gestureMenu"
      - "key.cpm.category"
      - "key.cpm.qa_1"

  collective:
    display-name: "Collective"
    trusted: true
    channels:
      # Only Collective 8.27+ registers this channel, and every one of those
      # builds (109 on Modrinth) ships these keys. Older Collective has no
      # channel of its own and no lang file, so it never matches. Don't
      # widen this to "collective:*".
      - "collective:collective_installed_packet"
    keys:
      - "collective.collective.message.headcachereset"
      - "collective.areas.gui.unnamedarea"
      - "collective.customcredits.message.showingcredits"

