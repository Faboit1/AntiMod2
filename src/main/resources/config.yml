# =====================================================================
#                          AntiMod Configuration
# =====================================================================
# This plugin detects banned client mods using the "sign translation
# key" exploit: the server sends a fake sign to the client containing
# translation keys with a known fallback. If the client has the mod,
# it renders the mod's translated string; if not, the fallback is
# returned. The client's response reveals which mods are installed.
#
#
#
#
# The entire detection cycle happens silently during the join sequence
# (or on demand), and the sign editor never visibly opens for players
# on modern clients when the container is force-closed in time.
# =====================================================================

detection:
  # Run detection automatically when a player joins.
  on-join: true

  # Delay after join before running detection (in ticks; 20 ticks = 1 second).
  # 0 = probe immediately (next tick), while the client is still on the loading
  # screen — this is the fastest and most silent. Raise it only if a client
  # needs time to settle before it will answer probes.
  join-delay-ticks: 0

  # Run detection periodically for online players.
  periodic:
    enabled: false
    # Interval in seconds.
    interval: 600

  # How long to wait for a client response before discarding the session.
  # While a sweep is inside this window it owns the player's sign positions:
  # automatic sweeps (join / periodic) will not start a second one on top of it,
  # because that would overwrite the phantom signs on the client and throw away
  # answers that are still in flight. `/antimod check` always probes anyway.
  response-timeout-ticks: 100

  # The phantom sign is placed relative to the player's current position.
  # It must be within render distance or the client will ignore it.
  # This offset is added ABOVE the player's Y coordinate (100 = 100 blocks up).
  # If going up would pass the world height limit, it is placed below instead.
  # When several signs are probed at once they stack upward from this point.
  # In a low-ceiling world (the Nether is only 128 blocks tall) an offset larger
  # than the build range leaves no room either way; the signs are then placed at
  # whichever end of the world is farther from the player. Every sign always
  # gets its own block, since two signs on one block means only one of them is
  # ever answered.
  sign-y-offset: 100

  # The fallback text sent alongside each translation key.
  # If the client returns this string, the key was NOT translated (mod absent).
  # If the client returns something else, the mod IS present.
  # Keep it short and unlikely to collide with real mod translations.
  fallback-marker: "am_fb"

  # Delay (in ticks) between sending Open Sign Editor and Close Window packets.
  # 0 = same tick (most silent). If the sign UI briefly flashes for players,
  # try 1 — still invisible during the loading screen.
  close-delay-ticks: 0

  # Keys to test per sign (each sign has 4 lines, so max is 4).
  # All signs are sent at once regardless; this just controls how many keys
  # are packed into each sign. 1 = one key per sign (most signs, clearest
  # attribution); 4 = fewer signs, each carrying up to four keys.
  keys-per-sign: 1

  # Enable detection for Floodgate (Bedrock/Xbox) players.
  # Set to false to skip detection for players connecting via Geyser.
  # Requires Floodgate plugin to be installed.
  floodgate-enabled: true

# =====================================================================
# Notifications & logging
# =====================================================================
notifications:
  # Log every detection to the server console.
  console-log: true

  # Broadcast in-game to players with 'antimod.notify' permission.
  staff-broadcast: true

  # Message sent to staff. MiniMessage format supported.
  # Placeholders: <player>, <uuid>, <mod>, <violations>, <action>, <keys>
  staff-message: "<red>[AntiMod]</red> <yellow><player></yellow> <gray>detected using</gray> <red><mod></red> <gray>(violation #<violations>, action: <action>)</gray>"

  # Message written to console. Regular text; use & for legacy color if desired.
  console-message: "[AntiMod] {player} ({uuid}) detected using {mod} — violation #{violations} — action: {action} — matched keys: {keys}"

# =====================================================================
# Violation storage
# =====================================================================
storage:
  # File in the plugin folder where per-player violation counts are saved.
  file: "violations.yml"

  # Reset a player's violations for a mod after this many days without a new
  # detection (0 = never reset).
  reset-after-days: 30

# =====================================================================
# Spoof detection (OpSec, ExploitPreventer and similar)
# =====================================================================
# Some client mods stop translation keys from resolving on signs, so every
# probe comes back as the fallback and banned mods go unseen. This check
# catches clients whose answers contradict their plugin channels:
#
#   1. On join the client announces the plugin channels its mods listen on
#      (minecraft:register). A channel such as "voicechat:..." proves that
#      Simple Voice Chat is installed.
#   2. Every sweep then also probes that mod's own translation keys.
#   3. A real install always resolves them. If the channel is there but every
#      key comes back as the fallback, the client is hiding translations.
#
# The mods used for this live in plugins/AntiMod/spoof-mods.yml (channels +
# keys per mod). Add your own there; `/antimod channels <player>` shows what
# a client registered.
#
# Note: by default, OpSec (AUTO whitelist) and ExploitPreventer both let the
# keys of channel-registering mods resolve, so a default install answers
# consistently and is NOT flagged. This catches stricter setups, e.g. keys
# blocked for a mod whose channels are still visible.
spoof-detection:
  enabled: true

  # Hold the join sweep until the client has announced its channels, so the
  # channel-confirmed mods can be probed in that same sweep. Clients reporting
  # the "vanilla" brand have no channels and are probed right away as usual.
  wait-for-channels: true

  # Longest wait for the announcement (ticks). A modded client that never
  # sends one is probed after this delay.
  channel-wait-ticks: 20

  # The announcement can span several packets: probe this many ticks after
  # the last one arrives.
  channel-settle-ticks: 2

  # How many channel-confirmed mods to probe per sweep (each adds up to 3
  # keys). The first matches in spoof-mods.yml order are used.
  max-mods-per-sweep: 8

  # A client that hides translations hides them for every mod. So a player is
  # only flagged when the channel-confirmed mods that hid all their keys
  # OUTNUMBER the ones that resolved theirs: if most mods verify, the player
  # is fine even if a few did not. On top of that, at least this many mods
  # must be hidden, so one stray channel can never flag anyone on its own.
  # 1 is stricter but less forgiving.
  min-hidden-mods: 2

  # Retire unreliable entries automatically: when an entry fails for this many
  # DIFFERENT players who verified every other mod in the same sweep, it is
  # commented out in spoof-mods.yml (with a note why) and the list reloads.
  # Tallies are kept in spoof-mod-misses.yml. 0 = never.
  auto-disable-after: 5

  # Also flag a Java 1.19.4+ client that echoes a probed key back verbatim:
  # those clients always answer with the fallback we supply. Older clients
  # (via ViaBackwards) show the raw key as normal vanilla behaviour and Bedrock
  # players are skipped, so neither is ever flagged by this.
  flag-raw-key-echo: true

  # Channels that never count as proof of a mod. A proxy registers its own
  # plugins' channels on the backend for EVERY player, so they look like the
  # client's: Velocity does this for voicechat-velocity's "voicechat:secret"
  # and "voicechat:request_secret". `*` matches anything.
  ignore-channels:
    - "voicechat:request_secret"   # Simple Voice Chat proxy plugin
    - "voicechat:secret"           # Simple Voice Chat proxy plugin
    - "vc:*"                       # Simple Voice Chat proxy plugin (legacy)
    - "bungeecord:main"
    - "BungeeCord"
    - "velocity:*"
    - "vv:*"                       # ViaVersion
    - "luckperms:*"
    - "authmevelocity:*"
    - "tab:*"
    - "sr:*"                       # SkinsRestorer
    - "skinsrestorer:*"
    - "floodgate:*"
    - "geyser:*"
    - "plan:*"
    - "litebans:*"

  # Learn the rest automatically: a vanilla client never registers channels,
  # so any channel a vanilla-brand connection carries was added by the proxy
  # or server and is ignored for everyone (logged once per channel).
  learn-proxy-channels: true

  # The violation id ({mod-id}) and name ({mod}) used for this detection.
  # `/antimod clear <player> translation-spoofer` resets it.
  id: "translation-spoofer"
  display-name: "Translation Spoofer"

  # Same format as a mod's actions below. {keys} lists the evidence, e.g.
  # "hid 3 of 4 channel-confirmed mods: Jade [jade:receive_data], ...".
  # Every detection kicks (threshold 1 applies to every violation count).
  actions:
    - threshold: 1
      commands:
        - "kick {player} &cTranslation-spoofing mods (OpSec, ExploitPreventer, ...) are not allowed. &7Disable them and rejoin."
      broadcast: "&e[AntiMod] &e{player} &7was kicked for hiding mod translations &8({keys})"
      staff-only: true

# =====================================================================
# Mod scan (/antimod mods <player>)
# =====================================================================
# Probes a player for every mod in plugins/AntiMod/mod-catalog.yml (thousands
# of popular mods) and the banned mods below, then lists what was found:
#   - mods detected by their translation keys
#   - mods the player's plugin channels say they have, marked "verified" if
#     their keys resolved or "keys hidden" if every key came back untranslated
# A scan only reports. It never records violations or runs actions.
mod-scan:
  # Translation keys packed into each sign LINE (1-3; 4 lines per sign).
  # The client answers every sign with one packet, so packing more keys means
  # far fewer answers: at 3, the full catalog fits in roughly 400 signs.
  # 3 is the most that safely fits the 384 characters a line's answer may use.
  keys-per-line: 3

  # 0 = send the whole scan at once (it finishes in about a second). A huge
  # scan is still split into bursts of 600 signs a second apart, since
  # ViaVersion kicks clients that answer with over 800 packets a second.
  # Set a number to pace it at that many signs per tick instead.
  signs-per-tick: 0

  # How long to wait for answers after the last sign went out (ticks).
  response-timeout-ticks: 100

# =====================================================================
# Banned mods & actions
# =====================================================================
# Each entry under `mods` is one mod to detect.
#
# Fields per mod:
#   display-name    Human-readable name shown in messages/commands.
#   enabled         Whether this mod is actively tested (default: true).
#   keys            List of translation keys the client should NOT have.
#                   If ANY of these come back translated, the mod is flagged.
#   actions         List of actions triggered at violation thresholds.
#
# Fields per action:
#   threshold       Trigger when the player's violation count for this mod
#                   reaches this number (1 = first offense).
#   commands        List of console commands to run (executed in order).
#                   Written without a leading slash; one is stripped if present.
#   broadcast       Optional message broadcast to the whole server.
#   staff-only      If true, broadcast only to staff (antimod.notify).
#   message         Optional message sent to the offending player before
#                   commands run (useful for warnings).
#
# Placeholders (in all commands/messages):
#   {player}        Player name
#   {uuid}          Player UUID
#   {mod}           Mod display name
#   {mod-id}        Config key (e.g. "meteor-client")
#   {violations}    Current violation count for this mod
#   {keys}          Comma-separated list of matched translation keys
# =====================================================================
mods:

  # ---------------- Severe cheat clients: instant ban ----------------

  meteor-client:
    display-name: "Meteor Client"
    enabled: true
    keys:
      - "key.meteor-client.open-gui"
      - "text.autoconfig.meteor-client.title"
    actions:
      - threshold: 1
        commands:
          - "litebans:ban {player} 25d Cheating ({mod})"
        broadcast: "&c[AntiMod] &e{player} &chas been banned for using &4{mod}&c!"

  wurst-client:
    display-name: "Wurst Client"
    enabled: true
    keys:
      - "key.wurst.togglegui"
      - "key.wurst.zoom"
    actions:
      - threshold: 1
        commands:
          - "litebans:ban {player} 25d Cheating ({mod})"
        broadcast: "&c[AntiMod] &e{player} &chas been banned for using &4{mod}&c!"

  # AutoTotem module (Meteor addon and standalone versions)
  autototem:
    display-name: "AutoTotem"
    enabled: true
    keys:
      - "key.autototem.toggle"
    actions:
      - threshold: 1
        commands:
          - "litebans:ban {player} 20d Cheating ({mod})"
        broadcast: "&c[AntiMod] &e{player} &chas been banned for using &4{mod}&c!"

  # ---------------- Medium-severity: warn, then ban ----------------

  freecam:
    display-name: "Freecam"
    enabled: true
    keys:
      - "key.freecam.toggle"
      - "key.freecam.tripod_reset"
    actions:
      - threshold: 1
        commands:
          - "kick {player} &c&lRemove {mod} before rejoining!&r &7(Warning 1/3)"
        broadcast: "&e[AntiMod] &e{player} &7was kicked for using &c{mod} &7(warning 1/3)"
      - threshold: 2
        commands:
          - "kick {player} &c&lFinal warning: remove {mod}!&r &7(Warning 2/3)"
        broadcast: "&e[AntiMod] &e{player} &7was kicked for using &c{mod} &7(warning 2/3)"
      - threshold: 3
        commands:
          - "litebans:ban {player} 14d Cheating ({mod}) - Repeated warnings ignored"
        broadcast: "&c[AntiMod] &e{player} &chas been banned for repeatedly using &4{mod}&c!"

  # ItemScroller / Carpet Ctrl+Q crafting (config-key example)
  itemscroller:
    display-name: "Item Scroller"
    enabled: true
    keys:
      - "itemscroller.config.generic.name.carpetCtrlQCraftingEnabledOnServer"
    actions:
      - threshold: 1
        message: "&c[AntiMod] &7Please disable &c{mod}&7. This is a warning."
        broadcast: "&e[AntiMod] &e{player} &7was warned for using &c{mod}"
      - threshold: 3
        commands:
          - "kick {player} &cRemove {mod} before rejoining!"
      - threshold: 5
        commands:
          - "litebans:ban {player} 3d Using {mod} despite repeated warnings"

  # ---------------- Detection-only (no action) example ----------------
  # Useful for keeping tabs on mods you don't ban but want to know about.
  # xaeros-minimap:
  #   display-name: "Xaero's Minimap"
  #   enabled: false
  #   keys:
  #     - "key.xaero_open_map"
  #     - "key.xaero_zoom_in"
  #   actions:
  #     - threshold: 1
  #       broadcast: "&e[AntiMod] &e{player} &7is using &b{mod} &7(allowed, informational)"
  #       staff-only: true
